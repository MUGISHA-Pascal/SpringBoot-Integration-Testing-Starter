# Test Configuration for Integration Tests
# This configuration uses H2 in-memory database instead of PostgreSQL for fast, isolated testing

# Application name
spring.application.name=school-mis-test

# H2 Database Configuration
# Using in-memory database that is created fresh for each test run
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
# Create-drop ensures clean database state for each test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (useful for debugging tests if needed)
spring.h2.console.enabled=true
